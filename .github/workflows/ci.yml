name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node-version }})
    # 两个平台都跑。路径语义以「数据根自己的方言」为准：Windows 数据根在 ubuntu
    # runner 上必须算出同一个字符串。只跑 Linux 时，Windows 上独有的路径 bug 和
    # 只在 Linux 上暴露的 POSIX 假设，都只能靠碰运气才发现。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, build
        run: npm run check

      # 只跑一次：检查 files 字段有没有配错（漏文件 / 指向不存在的路径）
      - name: Verify package contents
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: npm pack --dry-run
